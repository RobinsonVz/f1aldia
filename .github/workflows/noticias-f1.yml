
name: Noticias F1 automaticas

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias-f1
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install gnews-decoder

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Actualizar noticias
        run: python scripts/actualizar_noticias.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html imagenes/noticias/
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar noticias del ultimo GP"
            git push
          else
            echo "No hay cambios para publicar."
          fi
